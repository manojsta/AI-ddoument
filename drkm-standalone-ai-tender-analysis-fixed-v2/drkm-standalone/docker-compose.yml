services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drkm}
      POSTGRES_USER: ${POSTGRES_USER:-drkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drkm} -d ${POSTGRES_DB:-drkm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drkm}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-drkm}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    volumes:
      - documents:/data/documents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --pool=solo
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drkm}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-drkm}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    volumes:
      - documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
  documents:
